
[gcode_macro PRINTER_VARIABLES]
# Offset coordinates for dual_carriage
variable_offset_x: 0 #-0.06  #-0.3 #was -0.15
variable_offset_y: 0 #-0.15 #was -0.15 #-0.3 #was0
variable_offset_z: 0  # 0.23
# Autopark parameters
## default autopark: 0:inactive - 1:active
variable_autopark: 1
variable_z_hop: 0.6
variable_movespeed: 300 #mm/s
variable_feedrate: 8000 #mm/min
# HeatBed size
variable_bed_x_min: 0
variable_bed_x_max: 430
variable_bed_y_min: 0
variable_bed_y_max: 400
# Print cooling fans names
variable_fan0: 'extruder_CF'
variable_fan1: 'extruder1_CF'  # For dual extruder compatibility
# Extruders temp (for IDEX printers)
variable_offset_temp: 4
# Pause Positions
variable_tool0_pause_position_x: -20
variable_tool0_pause_position_y: -20
variable_tool1_pause_position_x: 0  # For dual extruder compatibility
variable_tool1_pause_position_y: 0  # For dual extruder compatibility
gcode:
    G90


[printer]
kinematics: fracktal_hybrid_corexy
max_velocity: 2000 #1000 #700
max_accel: 40000 #30000
#max_accel_to_decel: 25000 # 5000
minimum_cruise_ratio: 0
square_corner_velocity: 100
max_z_velocity: 20
max_z_accel: 100 #50

########################################
# X Axis
########################################

[stepper_x]
position_endstop: -22.000
position_min: -22.000
position_max: 520.000

########################################
# Y Axis
########################################

[stepper_y]
position_endstop: 420
position_max: 420
position_min: -47

########################################
# Z Axis
########################################

[stepper_z]
position_endstop: 413 #410
position_max: 413 #410
position_min: -6

########################################
# Input Shaping and Resonance
########################################

[resonance_tester]
probe_points:
    310,120,20
accel_chip: adxl345 toolhead0

########################################
# Bed Mesh
########################################

[bed_mesh]
mesh_min: 50, 40
mesh_max: 470, 380
probe_count: 5,5
speed: 200