########################################
# Filament Sensor Hardware Configuration
########################################

[filament_switch_sensor switch_sensor_T1]  
switch_pin: ^PF4 
pause_on_runout: True #False 
runout_gcode: 
    RESPOND TYPE=echo MSG="Filament Runout detected on T1"
insert_gcode: 
    RESPOND TYPE=echo MSG="Filament inserted on T1"


[delayed_gcode SET_T1_FILAMENT_RUNOUT_SENSOR_STARTUP]
initial_duration: 1
gcode:
    SET_FILAMENT_SENSOR SENSOR=switch_sensor_T1 ENABLE=0
