# Author: Vijay Raghav Varada
# Version: 1
########################################

########################################
# Filament Sensor Hardware Configuration
########################################

[filament_switch_sensor switch_sensor_T1]  
switch_pin: ^PF0
pause_on_runout: False #False 
runout_gcode: 
    ; DEBUG: Log when T1 switch sensor triggers
    RESPOND TYPE=echo MSG="DEBUG switch_sensor_T1: triggered, homed={printer.toolhead.homed_axes}, extruder={printer.toolhead.extruder}"
    {% if printer.toolhead.homed_axes == "xyz" and printer.toolhead.extruder == "extruder1" %}
        RESPOND TYPE=echo MSG="Filament Runout Detected on T1"
    {% endif %}
insert_gcode: 
    RESPOND TYPE=echo MSG="Filament Inserted on T1"


[delayed_gcode SET_T1_FILAMENT_RUNOUT_SENSOR_STARTUP]
initial_duration: 1
gcode:
    SET_FILAMENT_SENSOR SENSOR=switch_sensor_T1 ENABLE=0
