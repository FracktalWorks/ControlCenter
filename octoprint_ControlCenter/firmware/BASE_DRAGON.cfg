########################################
# BASE_DRAGON.cfg
# Common Main MCU/Motherboard related Configuration for single nozzle printer variants
# Author: Vijay Raghav Varada, Hamil Sunny
# Version: 1
########################################

########################################
# X Steppers-M1
# See KINAMATICS.cfg and TOOLHEADX.cfg for more settings for this section
########################################

[stepper_x]
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 32
homing_speed: 60
homing_retract_dist: 10.0

[tmc5160 stepper_x]
cs_pin: PC13
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: False
run_current: 1.20
hold_current: 0.60
sense_resistor: 0.075

########################################
# Y Steppers- M4
# See KINAMATICS.cfg and TOOLHEADX.cfg for more settings for this section
########################################

[stepper_y]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
microsteps: 16
rotation_distance: 32
endstop_pin: ^PF2
homing_speed: 60
homing_retract_dist: 10.0

[tmc5160 stepper_y]
cs_pin: PB5
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: False
run_current: 1.20
hold_current: 0.60
sense_resistor: 0.075

########################################
# Y Steppers- M5
########################################

[stepper_y1]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
microsteps: 16
rotation_distance: 32
endstop_pin: ^PF2

[tmc5160 stepper_y1]
cs_pin: PG14
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: False
run_current: 1.20
hold_current: 0.60
sense_resistor: 0.075

########################################
# Z Steppers- M3
# See KINAMATICS.cfg for more settings for this section
########################################
[stepper_z]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
microsteps: 8
rotation_distance: 4
endstop_pin: ^PF1
homing_speed: 50
homing_retract_dist: 5.0

[tmc5160 stepper_z]
cs_pin: PB9
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: False
hold_current: 1.5
run_current: 2.5
sense_resistor: 0.022

########################################
# Redundant Extruder Extruder Side 0
########################################

[extruder_stepper extruder_side0]
extruder: extruder
step_pin:  PG9
dir_pin: PD7
enable_pin: !PG11
microsteps: 16
rotation_distance: 7.710  #22.102

[tmc5160 extruder_stepper extruder_side0]
cs_pin: PG10
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
hold_current: 0.40
run_current: 1.00
interpolate: False
sense_resistor: 0.075

########################################
# Heater Bed
########################################
[heater_bed]
heater_pin: PA3
sensor_type: EPCOS 100K B57560G104F #Generic 3950
sensor_pin: PB1
control: pid
pid_kp: 45.874
pid_ki: 1.335
pid_kd: 393.945
pwm_cycle_time: 0.3
min_temp: -150
max_temp: 150

########################################
# Probe and ABL
########################################

[probe]
pin: PD8
x_offset: 0
y_offset: 0
#z_offset: -0.2
sample_retract_dist: 2.0
speed: 4
lift_speed: 10
samples_tolerance: 0.05
samples:1
samples_result: average
samples_tolerance_retries : 8

########################################
# Bed Mesh & Exclude Objects
########################################

[bed_mesh]
horizontal_move_z: 5
probe_count: 5,5
algorithm: bicubic
#adaptive_margin: 5

########################################
# Input Shaping 
########################################

[input_shaper]

########################################
# Single Nozzle Configuration
########################################

[respond]
default_type: echo

########################################
# Misc.
########################################

[delayed_gcode STARTUP]
initial_duration: 1
gcode:
    SET_LED LED=toolhead0 GREEN=1.0

########################################
# Single Nozzle Tool Management
########################################

# For single nozzle printer, T0 is always active, T1 commands are ignored with message
[gcode_macro T0]
description: Tool 0 (already active on single nozzle printer)
gcode:
    RESPOND TYPE=echo MSG="Active Extruder: 0"

[gcode_macro T1] 
description: Tool 1 not available on single nozzle printer
gcode:
    RESPOND TYPE=echo MSG="Active Extruder: 0"

########################################
# Temperature & Fans (Single Nozzle)
########################################

[gcode_macro M106]
description: Set print cooling fan speed for single nozzle
rename_existing: M106.1
gcode:
    {% set raw_speed = params.S|default(0)|float %}
    {% set fan_speed = (raw_speed / 255.0)|round(2) %}
    {% if (params.P) is defined %}
        {% if (params.P)|int == 0 %}
            SET_FAN_SPEED FAN=extruder_CF SPEED={fan_speed}
        {% else %}
            RESPOND TYPE=echo MSG="Fan P{params.P} not available on single nozzle printer"
        {% endif %}
    {% else %}
        SET_FAN_SPEED FAN=extruder_CF SPEED={fan_speed}
    {% endif %}
    
[gcode_macro M107]
description: Turn off print cooling fan
gcode:
    M106 S0

# Override M104 to handle T1 commands gracefully on single nozzle
[gcode_macro M104]
rename_existing: M104.1
description: Set extruder temperature (single nozzle)
gcode:
    {% set temp = params.S|default(0)|float %}
    {% set tool = params.T|default(0)|int %}
    {% if tool == 0 or tool == -1 %}
        M104.1 S{temp}
    {% elif tool == 1 %}
        RESPOND TYPE=echo MSG="T1 not available on single nozzle printer, ignoring M104 T1"
    {% else %}
        RESPOND TYPE=error MSG="Invalid tool T{tool}"
    {% endif %}
    
# Override M109 to handle T1 commands gracefully on single nozzle
[gcode_macro M109]
rename_existing: M109.1
description: Set extruder temperature and wait (single nozzle)
gcode:
    {% set temp = params.S|default(0)|float %}
    {% set tool = params.T|default(0)|int %}
    {% if tool == 0 or tool == -1 %}
        M109.1 S{temp}
    {% elif tool == 1 %}
        RESPOND TYPE=echo MSG="T1 not available on single nozzle printer, ignoring M109 T1"
    {% else %}
        RESPOND TYPE=error MSG="Invalid tool T{tool}"
    {% endif %}

########################################
# PAUSE & Resume Functionality for Single Nozzle
########################################

[pause_resume]

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set dragon_var = printer["gcode_macro DRAGON_VARIABLES"] %}
    {% set z = params.Z|default(dragon_var.z_hop)|float %}                                                          ;Zhop on Pause
    {% set r = params.R|default(2.0)|float %}                                                                       ;Retract on Pause
    {% if printer['pause_resume'].is_paused|int == 0 %}                                                             ;if PAUSE was already called, skip
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={{ printer['extruder'].target|default(0)|int }}        ; set hotend temp variable for reference in resume macro
        
        ;Filament Sensors are set/reset in ControlCenter
        ;SET_FILAMENT_RUNOUT_SENSOR S0                                                                            ;Disable Filament Runout Sensors on pause
        ;SET_FILAMENT_JAM_SENSOR S0                                                                                 ;Disable Filament Jam Sensors on pause

        SAVE_GCODE_STATE NAME=PAUSE                                                                                 ; save current print position for resume
        BASE_PAUSE                                                                                                  ; Pause print
        
        {% if printer.gcode_move.gcode_position.z < (printer.toolhead.axis_maximum.z - z) %}
            G91                                                                                                     ; relative positioning
            G1 Z{z} F900                                                                                            ; move up by z hop amount
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                                        ; if current Z + z hop > max Z
        {% endif %}
        G90                                                                                                         ; absolute positioning
        G1 X{dragon_var.pause_position_x} Y{dragon_var.pause_position_y} F{dragon_var.feedrate}                   ; park toolhead at pause position
        M106 S0                                                                                                     ; turn off part cooling fan
        {% if printer.extruder.temperature >= 150 %}
            G1 E-{r} F2100                                                                                          ; retract filament
        {% endif %}
    {% endif %}

[gcode_macro CLEAN_NOZZLE]
gcode:
    {% set dragon_var = printer["gcode_macro DRAGON_VARIABLES"] %}
    G90
    G1 X{dragon_var.pause_position_x + 10} Y{dragon_var.pause_position_y + 10} F{dragon_var.feedrate}
    G1 X{dragon_var.pause_position_x + 50} F{dragon_var.feedrate}
    G1 X{dragon_var.pause_position_x + 10}
    G1 X{dragon_var.pause_position_x + 50}
    G1 X{dragon_var.pause_position_x + 10}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    {% set e = params.E|default(20)|float %}                      ; hotend prime amount (mm)
    {% set r = params.R|default(1)|float %}                       ; retract recovery (mm)
    {% if printer['pause_resume'].is_paused|int != 1 %}
        RESPOND TYPE=echo MSG="RESUME ignored (not paused)"
    {% else %}
        ; Restore temps
        {% if etemp > 0 %}
            M104 S{etemp|int}
            M109 S{etemp|int}
        {% endif %}
        
        {# Determine if we can safely prime #}
        {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp|float %}
        {% set can_prime = (printer.extruder.temperature|float >= min_temp) %}
        
        {% if can_prime %}
            G90
            G1 E{r} F2100                                                                                           ; unretract filament
        {% endif %}
        
        CLEAN_NOZZLE
        M420 S1                                                                                                     ; restore bed mesh if available
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=150                                                       ; restore position
        
        {% if can_prime %}
            G90
            G1 E{e} F900                                                                                            ; prime nozzle
        {% endif %}
        
        BASE_RESUME VELOCITY=150
    {% endif %}
